id: net.wifi-password-change
title: Change the Wi-Fi password
kind: answer
description: Steps to change the Wi-Fi password on the router.
patterns:
- how do i change my wifi password
- change the wifi password
- new wifi password
- forgot the wifi password
- new password for our wifi
- where do i change the wireless password
- make a new wifi password
keywords:
- password
text: '1. Ask "router address" and open it in a browser.

  2. Log in (the details are often on a sticker on the router).

  3. Find Wireless / Wi-Fi settings → Password (WPA2/WPA3 key).

  4. Save. Every device will need the new password.

  Use 12+ characters; a short phrase is easiest.'
