text: '1. Router admin password: change it from the default.

  2. Wi-Fi security: WPA3 (or WPA2-AES), strong password.

  3. Turn off WPS and remote management.

  4. Update the router firmware.

  5. Put smart-home gadgets on the guest network.

  6. Check devices: ask "devices on my network".'
# core: the branch can only win if each group has a word in the message (synonyms count)
