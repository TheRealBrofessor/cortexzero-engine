id: net.secure-network
title: Secure my home network
kind: answer
description: Checklist to make a home network safer.
patterns:
- how do i make my home network safe
- secure my wifi
- is my network secure
- protect my home network from hackers
- make our wifi more secure
- keep hackers off our network
- is our home network safe
- protect our wifi from strangers
- make sure everything is locked down
