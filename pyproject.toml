[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "czengine"
version = "0.2.0"
description = "CortexZero engine: a 1B model routes, deterministic code answers, checks and acts."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["pyyaml>=6"]

[project.scripts]
cz = "czengine.cli:main"

[tool.setuptools]
packages = ["czengine"]

[tool.pytest.ini_options]
pythonpath = ["."]
