<svg xmlns='http://www.w3.org/2000/svg' width='1000' height='350' viewBox='0 0 1000 350' font-family='DejaVu Sans, Arial, sans-serif'><title>Evaluation process</title><rect width='100%' height='100%' fill='#ffffff'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#52606d'/></marker></defs><text x='500.0' y='34' font-size='20' fill='#1f2933' text-anchor='middle' font-weight='bold'>How the numbers were produced (only code-checked results count)</text><rect x='30' y='70' width='200' height='70' rx='8' fill='#fff3e0' stroke='#e07b00' stroke-width='1.5'/><text x='130.0' y='92.875' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#1f2933'>Hermes czcasewriter</text><text x='130.0' y='109.375' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>writes NEW messages</text><text x='130.0' y='125.875' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>(never sees labels)</text><rect x='290' y='60' width='200' height='40' rx='8' fill='#fff3e0' stroke='#e07b00' stroke-width='1.5'/><text x='390.0' y='84.375' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#1f2933'>czlabela (nemotron)</text><rect x='290' y='110' width='200' height='40' rx='8' fill='#fff3e0' stroke='#e07b00' stroke-width='1.5'/><text x='390.0' y='134.375' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#1f2933'>czlabelb (gpt-oss-20b)</text><line x1='230' y1='95' x2='290' y2='80' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><line x1='230' y1='105' x2='290' y2='130' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><rect x='550' y='70' width='200' height='70' rx='8' fill='#e3f2fd' stroke='#1e6fb8' stroke-width='1.5'/><text x='650.0' y='93.2' text-anchor='middle' font-size='12' font-weight='bold' fill='#1f2933'>agreement filter</text><text x='650.0' y='109.2' text-anchor='middle' font-size='10.5' font-weight='normal' fill='#52606d'>keep only messages both</text><text x='650.0' y='125.2' text-anchor='middle' font-size='10.5' font-weight='normal' fill='#52606d'>labellers agreed on</text><line x1='490' y1='80' x2='550' y2='95' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><line x1='490' y1='130' x2='550' y2='115' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><rect x='800' y='70' width='180' height='70' rx='8' fill='#e8f5e9' stroke='#2e7d32' stroke-width='1.5'/><text x='890.0' y='92.875' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#1f2933'>score ONCE</text><text x='890.0' y='109.375' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>index + 3 local 1Bs</text><text x='890.0' y='125.875' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>→ RESULTS.md</text><line x1='750' y1='105' x2='800' y2='105' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><line x1='890' y1='140' x2='890' y2='190' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><rect x='760' y='190' width='220' height='54' rx='8' fill='#f5f7fa' stroke='#7b8794' stroke-width='1.5'/><text x='870.0' y='213.125' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#1f2933'>then it becomes a dev set</text><text x='870.0' y='229.625' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>(tuning allowed only now)</text><rect x='30' y='200' width='330' height='70' rx='8' fill='#ffebee' stroke='#c62828' stroke-width='1.5'/><text x='195.0' y='222.875' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#1f2933'>Codex: independent code review</text><text x='195.0' y='239.375' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>17 findings → each reproduced on disk</text><text x='195.0' y='255.875' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>16 fixed + regression tests</text><rect x='390' y='200' width='330' height='70' rx='8' fill='#ffebee' stroke='#c62828' stroke-width='1.5'/><text x='555.0' y='222.875' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#1f2933'>Hermes czredteam: 80 attack messages</text><text x='555.0' y='239.375' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>real misses fixed; nonsense labels ignored</text><text x='555.0' y='255.875' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>misroutes refused 14/35 → 27/35</text><text x='30' y='310' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>Held-out sets so far: v2 → dev2, v3 → dev3, camping v1 → camping dev2, v4 → dev4 (each scored once, then used for tuning).</text><text x='30' y='330' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>Writers and labellers never see each other's output or the engine's answers. Held-out sets are never used for tuning before their one scoring.</text></svg>