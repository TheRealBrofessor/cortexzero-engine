<svg xmlns='http://www.w3.org/2000/svg' width='1040' height='760' viewBox='0 0 1040 760' font-family='DejaVu Sans, Arial, sans-serif'><title>Routing decision</title><rect width='100%' height='100%' fill='#ffffff'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#52606d'/></marker></defs><text x='500.0' y='34' font-size='20' fill='#1f2933' text-anchor='middle' font-weight='bold'>Routing decision (czengine/router.py + index.py)</text><rect x='380' y='60' width='240' height='50' rx='8' fill='#e3f2fd' stroke='#1e6fb8' stroke-width='1.5'/><text x='500.0' y='81.05' text-anchor='middle' font-size='13' font-weight='bold' fill='#1f2933'>message (normalized)</text><text x='500.0' y='98.05' text-anchor='middle' font-size='11.5' font-weight='normal' fill='#52606d'>index scores every branch</text><line x1='500' y1='110' x2='500' y2='140' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><rect x='330' y='140' width='340' height='56' rx='8' fill='#e3f2fd' stroke='#1e6fb8' stroke-width='1.5'/><text x='500.0' y='164.05' text-anchor='middle' font-size='13' font-weight='bold' fill='#1f2933'>core gate</text><text x='500.0' y='181.05' text-anchor='middle' font-size='11.5' font-weight='normal' fill='#52606d'>branch is a candidate only if its core words appear</text><line x1='500' y1='196' x2='500' y2='226' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><rect x='250' y='226' width='500' height='54' rx='8' fill='#f5f7fa' stroke='#7b8794' stroke-width='1.5'/><text x='500.0' y='249.125' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#1f2933'>top score &lt; LOW (0.18)?</text><text x='500.0' y='265.625' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>decided_by: none</text><line x1='750' y1='253' x2='785' y2='253' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><text x='753.5' y='247.0' font-size='11.5' fill='#52606d' text-anchor='start'>yes</text><rect x='787' y='233' width='236' height='40' rx='8' fill='#f3e5f5' stroke='#7b1fa2' stroke-width='1.5'/><text x='905.0' y='257.2' text-anchor='middle' font-size='12' font-weight='normal' fill='#1f2933'>not in library</text><line x1='500' y1='280' x2='500' y2='306' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><text x='506.0' y='293.0' font-size='11.5' fill='#52606d' text-anchor='start'>no</text><rect x='250' y='306' width='500' height='54' rx='8' fill='#f5f7fa' stroke='#7b8794' stroke-width='1.5'/><text x='500.0' y='329.125' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#1f2933'>near-miss look-alike ≥ leader?</text><text x='500.0' y='345.625' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>decided_by: near-miss</text><line x1='750' y1='333' x2='785' y2='333' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><text x='753.5' y='327.0' font-size='11.5' fill='#52606d' text-anchor='start'>yes</text><rect x='787' y='313' width='236' height='40' rx='8' fill='#f3e5f5' stroke='#7b1fa2' stroke-width='1.5'/><text x='905.0' y='337.2' text-anchor='middle' font-size='12' font-weight='normal' fill='#1f2933'>not in library (topic logged)</text><line x1='500' y1='360' x2='500' y2='386' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><text x='506.0' y='373.0' font-size='11.5' fill='#52606d' text-anchor='start'>no</text><rect x='250' y='386' width='500' height='54' rx='8' fill='#f5f7fa' stroke='#7b8794' stroke-width='1.5'/><text x='500.0' y='409.125' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#1f2933'>clear winner? (≥0.55 &amp; margin 0.12, or ≥0.60 &amp; lead 0.25)</text><text x='500.0' y='425.625' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>decided_by: index</text><line x1='750' y1='413' x2='785' y2='413' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><text x='753.5' y='407.0' font-size='11.5' fill='#52606d' text-anchor='start'>yes</text><rect x='787' y='393' width='236' height='40' rx='8' fill='#e3f2fd' stroke='#1e6fb8' stroke-width='1.5'/><text x='905.0' y='417.2' text-anchor='middle' font-size='12' font-weight='normal' fill='#1f2933'>the leader branch</text><line x1='500' y1='440' x2='500' y2='466' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><text x='506.0' y='453.0' font-size='11.5' fill='#52606d' text-anchor='start'>no</text><rect x='250' y='466' width='500' height='54' rx='8' fill='#f5f7fa' stroke='#7b8794' stroke-width='1.5'/><text x='500.0' y='489.125' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#1f2933'>no model loaded?</text><text x='500.0' y='505.625' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>decided_by: index-only</text><line x1='750' y1='493' x2='785' y2='493' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><text x='753.5' y='487.0' font-size='11.5' fill='#52606d' text-anchor='start'>yes</text><rect x='787' y='473' width='236' height='40' rx='8' fill='#e3f2fd' stroke='#1e6fb8' stroke-width='1.5'/><text x='905.0' y='497.2' text-anchor='middle' font-size='12' font-weight='normal' fill='#1f2933'>leader if ≥ 0.60, else none</text><line x1='500' y1='520' x2='500' y2='546' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><text x='506.0' y='533.0' font-size='11.5' fill='#52606d' text-anchor='start'>no</text><rect x='250' y='546' width='500' height='54' rx='8' fill='#fff3e0' stroke='#e07b00' stroke-width='1.5'/><text x='500.0' y='569.125' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#1f2933'>otherwise: 1B model chooses top-3 | none | ask</text><text x='500.0' y='585.625' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>decided_by: model</text><line x1='750' y1='573' x2='785' y2='573' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><rect x='787' y='553' width='236' height='40' rx='8' fill='#fff3e0' stroke='#e07b00' stroke-width='1.5'/><text x='905.0' y='577.2' text-anchor='middle' font-size='12' font-weight='normal' fill='#1f2933'>its pick (ask → leader if ≥ 0.60)</text><line x1='500' y1='600' x2='500' y2='626' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><rect x='250' y='626' width='500' height='54' rx='8' fill='#f5f7fa' stroke='#7b8794' stroke-width='1.5'/><text x='500.0' y='649.125' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#1f2933'>branch acts on this computer/router but message names another device?</text><text x='500.0' y='665.625' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>decided_by: other-device</text><line x1='750' y1='653' x2='785' y2='653' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><text x='753.5' y='647.0' font-size='11.5' fill='#52606d' text-anchor='start'>yes</text><rect x='787' y='633' width='236' height='40' rx='8' fill='#f3e5f5' stroke='#7b1fa2' stroke-width='1.5'/><text x='905.0' y='657.2' text-anchor='middle' font-size='12' font-weight='normal' fill='#1f2933'>not in library</text><text x='20' y='720' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>The model can only return an id from the offered list, "none" or "ask" (JSON-schema enum). Anything else = model-failed, never an answer.</text><text x='20' y='740' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>The last check runs after any branch choice: e.g. "change the wifi password on my printer" → not this pack's job.</text></svg>