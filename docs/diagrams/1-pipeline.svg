<svg xmlns='http://www.w3.org/2000/svg' width='1170' height='712' viewBox='0 0 1170 712' font-family='DejaVu Sans, Arial, sans-serif'><title>CortexZero pipeline</title><rect width='100%' height='100%' fill='#ffffff'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#52606d'/></marker></defs><text x='560.0' y='34' font-size='20' fill='#1f2933' text-anchor='middle' font-weight='bold'>CortexZero engine: one message, end to end</text><text x='560.0' y='56' font-size='13' fill='#52606d' text-anchor='middle' font-weight='normal'>The 1B model only picks a branch id from a short list. Everything else is code and reviewed data.</text><rect x='200' y='80' width='580' height='64' rx='8' fill='#ffebee' stroke='#c62828' stroke-width='1.5'/><text x='490.0' y='107.9' text-anchor='middle' font-size='14' font-weight='bold' fill='#1f2933'>1  Safety rules (regex on raw text, every pack)</text><text x='490.0' y='125.9' text-anchor='middle' font-size='12.5' font-weight='normal' fill='#52606d'>crisis → 988 · emergency → 911 · scam warnings · per-pack rules</text><rect x='200' y='166' width='580' height='64' rx='8' fill='#e3f2fd' stroke='#1e6fb8' stroke-width='1.5'/><text x='490.0' y='193.9' text-anchor='middle' font-size='14' font-weight='bold' fill='#1f2933'>2  Consent reply?</text><text x='490.0' y='211.9' text-anchor='middle' font-size='12.5' font-weight='normal' fill='#52606d'>“yes” runs the action previewed on the turn before; consent expires after one turn</text><line x1='490.0' y1='144' x2='490.0' y2='166' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><rect x='200' y='252' width='580' height='64' rx='8' fill='#e3f2fd' stroke='#1e6fb8' stroke-width='1.5'/><text x='490.0' y='279.9' text-anchor='middle' font-size='14' font-weight='bold' fill='#1f2933'>3  Normalize</text><text x='490.0' y='297.9' text-anchor='middle' font-size='12.5' font-weight='normal' fill='#52606d'>protect paths/IPs/URLs · fix typos only toward known words · keep original</text><line x1='490.0' y1='230' x2='490.0' y2='252' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><rect x='200' y='338' width='580' height='64' rx='8' fill='#e3f2fd' stroke='#1e6fb8' stroke-width='1.5'/><text x='490.0' y='365.9' text-anchor='middle' font-size='14' font-weight='bold' fill='#1f2933'>4  Type-ahead index (no model)</text><text x='490.0' y='383.9' text-anchor='middle' font-size='12.5' font-weight='normal' fill='#52606d'>synonyms · stems · IDF pattern match · core-concept gate · near-miss decoys</text><line x1='490.0' y1='316' x2='490.0' y2='338' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><rect x='200' y='424' width='580' height='64' rx='8' fill='#fff3e0' stroke='#e07b00' stroke-width='1.5'/><text x='490.0' y='451.9' text-anchor='middle' font-size='14' font-weight='bold' fill='#1f2933'>5  Router</text><text x='490.0' y='469.9' text-anchor='middle' font-size='12.5' font-weight='normal' fill='#52606d'>clear winner → index · nothing plausible → none · else 1B picks top-3 | none | ask</text><line x1='490.0' y1='402' x2='490.0' y2='424' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><rect x='200' y='510' width='580' height='64' rx='8' fill='#e3f2fd' stroke='#1e6fb8' stroke-width='1.5'/><text x='490.0' y='537.9' text-anchor='middle' font-size='14' font-weight='bold' fill='#1f2933'>6  Handler</text><text x='490.0' y='555.9' text-anchor='middle' font-size='12.5' font-weight='normal' fill='#52606d'>answer (cited) · check (read-only argv) · action (preview → consent → run → verify)</text><line x1='490.0' y1='488' x2='490.0' y2='510' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><rect x='200' y='596' width='580' height='64' rx='8' fill='#e8f5e9' stroke='#2e7d32' stroke-width='1.5'/><text x='490.0' y='623.9' text-anchor='middle' font-size='14' font-weight='bold' fill='#1f2933'>7  Evidence log (JSONL)</text><text x='490.0' y='641.9' text-anchor='middle' font-size='12.5' font-weight='normal' fill='#52606d'>question · corrections · route + candidates · commands run · answer</text><line x1='490.0' y1='574' x2='490.0' y2='596' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><line x1='780' y1='112.0' x2='816' y2='112.0' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><rect x='818' y='92.0' width='320' height='40' rx='8' fill='#ffebee' stroke='#c62828' stroke-width='1.5'/><text x='978.0' y='116.2' text-anchor='middle' font-size='12' font-weight='bold' fill='#1f2933'>SAFETY: fixed response, never routed</text><line x1='780' y1='370.0' x2='816' y2='370.0' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><rect x='818' y='350.0' width='320' height='40' rx='8' fill='#f3e5f5' stroke='#7b1fa2' stroke-width='1.5'/><text x='978.0' y='374.2' text-anchor='middle' font-size='12' font-weight='bold' fill='#1f2933'>NOT IN LIBRARY (near-miss / too weak)</text><line x1='780' y1='456.0' x2='816' y2='456.0' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><rect x='818' y='436.0' width='320' height='40' rx='8' fill='#f3e5f5' stroke='#7b1fa2' stroke-width='1.5'/><text x='978.0' y='460.2' text-anchor='middle' font-size='12' font-weight='bold' fill='#1f2933'>NOT IN LIBRARY or ASK ("did you mean …")</text><line x1='780' y1='542.0' x2='816' y2='542.0' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><rect x='818' y='522.0' width='320' height='40' rx='8' fill='#f3e5f5' stroke='#7b1fa2' stroke-width='1.5'/><text x='978.0' y='546.2' text-anchor='middle' font-size='12' font-weight='bold' fill='#1f2933'>CHECKED / DONE / NOT FIXED / ANSWER</text><rect x='10' y='420' width='160' height='72' rx='8' fill='#fff3e0' stroke='#e07b00' stroke-width='1.5'/><text x='90.0' y='444.2' text-anchor='middle' font-size='12' font-weight='bold' fill='#1f2933'>1B router</text><text x='90.0' y='460.2' text-anchor='middle' font-size='10.5' font-weight='normal' fill='#52606d'>only when unsure</text><text x='90.0' y='476.2' text-anchor='middle' font-size='10.5' font-weight='normal' fill='#52606d'>LFM2.5 / Llama 3.2</text><line x1='170' y1='456' x2='200' y2='456' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><rect x='10' y='334' width='160' height='72' rx='8' fill='#e8f5e9' stroke='#2e7d32' stroke-width='1.5'/><text x='90.0' y='358.2' text-anchor='middle' font-size='12' font-weight='bold' fill='#1f2933'>Packs (YAML)</text><text x='90.0' y='374.2' text-anchor='middle' font-size='10.5' font-weight='normal' fill='#52606d'>or compiled JSON</text><text x='90.0' y='390.2' text-anchor='middle' font-size='10.5' font-weight='normal' fill='#52606d'>cz compile</text><line x1='170' y1='370' x2='200' y2='370' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><rect x='10' y='506' width='160' height='72' rx='8' fill='#ffebee' stroke='#c62828' stroke-width='1.5'/><text x='90.0' y='530.2' text-anchor='middle' font-size='12' font-weight='bold' fill='#1f2933'>LocalRunner</text><text x='90.0' y='546.2' text-anchor='middle' font-size='10.5' font-weight='normal' fill='#52606d'>argv only, no shell</text><text x='90.0' y='562.2' text-anchor='middle' font-size='10.5' font-weight='normal' fill='#52606d'>policy-checked</text><line x1='170' y1='542' x2='200' y2='542' stroke='#52606d' stroke-width='1.5' marker-end='url(#a)'/><rect x='70' y='686' width='14' height='14' rx='3' fill='#e3f2fd' stroke='#1e6fb8'/><text x='90' y='697.5' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>deterministic code</text><rect x='275' y='686' width='14' height='14' rx='3' fill='#fff3e0' stroke='#e07b00'/><text x='295' y='697.5' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>1B model (routing only)</text><rect x='480' y='686' width='14' height='14' rx='3' fill='#ffebee' stroke='#c62828'/><text x='500' y='697.5' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>safety boundary</text><rect x='685' y='686' width='14' height='14' rx='3' fill='#e8f5e9' stroke='#2e7d32'/><text x='705' y='697.5' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>data / log</text><rect x='890' y='686' width='14' height='14' rx='3' fill='#f3e5f5' stroke='#7b1fa2'/><text x='910' y='697.5' font-size='12' fill='#52606d' text-anchor='start' font-weight='normal'>what the user sees</text></svg>