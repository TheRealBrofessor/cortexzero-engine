<svg xmlns='http://www.w3.org/2000/svg' width='1010' height='700' viewBox='0 0 1010 700' font-family='DejaVu Sans, Arial, sans-serif'><title>Pack structure and execution boundary</title><rect width='100%' height='100%' fill='#ffffff'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#52606d'/></marker></defs><text x='500.0' y='34' font-size='20' fill='#1f2933' text-anchor='middle' font-weight='bold'>Packs: downloadable YAML libraries, validated on load</text><rect x='30' y='60' width='300' height='250' rx='8' fill='#e8f5e9' stroke='#2e7d32' stroke-width='1.5'/><text x='180.0' y='131.625' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#1f2933'>packs/&lt;name&gt;/</text><text x='180.0' y='148.125' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>pack.yaml — name, version, domain,</text><text x='180.0' y='164.625' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>status draft|unverified|reviewed,</text><text x='180.0' y='181.125' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>safety_critical, sources, synonyms,</text><text x='180.0' y='197.625' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>safety rules, other_devices</text><text x='180.0' y='214.125' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>branches/*.yaml — one branch each</text><text x='180.0' y='230.625' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>near-misses.yaml — out-of-scope look-alikes</text><text x='180.0' y='247.125' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>cases/dev.yaml — the pack's own tests</text><rect x='360' y='60' width='300' height='250' rx='8' fill='#e8f5e9' stroke='#2e7d32' stroke-width='1.5'/><text x='510.0' y='131.625' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#1f2933'>branch.yaml</text><text x='510.0' y='148.125' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>id, title, kind (answer|check|action)</text><text x='510.0' y='164.625' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>patterns — how people ask (≥ 2)</text><text x='510.0' y='181.125' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>core — concept words (gate)</text><text x='510.0' y='197.625' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>scope — computer|router|network|any</text><text x='510.0' y='214.125' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>text + sources (answer)</text><text x='510.0' y='230.625' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>steps argv + rules + default (check)</text><text x='510.0' y='247.125' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>risk ≥ 1 + verify step (action)</text><rect x='690' y='60' width='290' height='250' rx='8' fill='#ffebee' stroke='#c62828' stroke-width='1.5'/><text x='835.0' y='131.625' text-anchor='middle' font-size='12.5' font-weight='bold' fill='#1f2933'>Load-time validation rejects</text><text x='835.0' y='148.125' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>shell strings · interpreters/launchers</text><text x='835.0' y='164.625' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>programs not on the check/action allowlist</text><text x='835.0' y='181.125' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>bad regex / bad fmt fields</text><text x='835.0' y='197.625' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>actions without risk or verify</text><text x='835.0' y='214.125' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>“reviewed” without reviewed_by</text><text x='835.0' y='230.625' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>safety-critical answers without sources</text><text x='835.0' y='247.125' text-anchor='middle' font-size='11.0' font-weight='normal' fill='#52606d'>`cz pack validate` adds routing lint</text><text x='30' y='345' font-size='15' fill='#1f2933' text-anchor='start' font-weight='bold'>Packs</text><rect x='30' y='360' width='950' height='28' rx='5' fill='#f5f7fa' stroke='#7b8794'/><text x='40' y='379' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='bold'>home-network</text><text x='200' y='379' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>v0.2.0</text><text x='280' y='379' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>draft</text><text x='380' y='379' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>29 branches</text><text x='500' y='379' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>17 near-miss topics</text><text x='660' y='379' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>published</text><rect x='30' y='394' width='950' height='28' rx='5' fill='#ffebee' stroke='#c62828'/><text x='40' y='413' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='bold'>safety</text><text x='200' y='413' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>v0.1.0</text><text x='280' y='413' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>draft</text><text x='380' y='413' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>0 branches</text><text x='500' y='413' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>—</text><text x='660' y='413' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>crisis 988 · emergency 911 · scam</text><rect x='30' y='428' width='950' height='28' rx='5' fill='#ffebee' stroke='#c62828'/><text x='40' y='447' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='bold'>family-camping</text><text x='200' y='447' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>v0.1.0</text><text x='280' y='447' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>unverified</text><text x='380' y='447' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>14 branches</text><text x='500' y='447' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>safety-critical</text><text x='660' y='447' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>held back until expert review</text><rect x='30' y='462' width='950' height='28' rx='5' fill='#ffebee' stroke='#c62828'/><text x='40' y='481' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='bold'>tower-tech</text><text x='200' y='481' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>v0.0.1</text><text x='280' y='481' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>unverified</text><text x='380' y='481' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>3 branches</text><text x='500' y='481' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>safety-critical</text><text x='660' y='481' font-size='12.5' fill='#52606d' text-anchor='start' font-weight='normal'>held back until expert review</text><text x='30' y='520' font-size='15' fill='#1f2933' text-anchor='start' font-weight='bold'>Execution boundary (three layers)</text><rect x='30' y='535' width='950' height='44' rx='8' fill='#ffebee' stroke='#c62828' stroke-width='1.5'/><text x='505.0' y='553.05' text-anchor='middle' font-size='13' font-weight='bold' fill='#1f2933'>1  Pack loader</text><text x='505.0' y='570.05' text-anchor='middle' font-size='11.5' font-weight='normal' fill='#52606d'>argv[0] must be a bare program on the allowlist for the branch kind; check steps get read-only forms only</text><rect x='30' y='587' width='950' height='44' rx='8' fill='#ffebee' stroke='#c62828' stroke-width='1.5'/><text x='505.0' y='605.05' text-anchor='middle' font-size='13' font-weight='bold' fill='#1f2933'>2  Handler</text><text x='505.0' y='622.05' text-anchor='middle' font-size='11.5' font-weight='normal' fill='#52606d'>slot values typed + validated (public hosts only, ports 1-65535); chained values can’t start with “-”</text><rect x='30' y='639' width='950' height='44' rx='8' fill='#ffebee' stroke='#c62828' stroke-width='1.5'/><text x='505.0' y='657.05' text-anchor='middle' font-size='13' font-weight='bold' fill='#1f2933'>3  LocalRunner</text><text x='505.0' y='674.05' text-anchor='middle' font-size='11.5' font-weight='normal' fill='#52606d'>re-checks policy on the final argv; no shell, stdin closed, minimal env, timeout, output capped</text></svg>